<svg xmlns="http://www.w3.org/2000/svg" width="340" height="58" viewBox="0 0 340 58" role="img" aria-label="Download Resume PDF">
  <title>Download Resume (PDF)</title>
  <defs>
    <!-- Base fill: emerald, deliberately unlike the red/blue/black badges above it -->
    <linearGradient id="dlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <!-- Inner glow. Sits INSIDE the shape, so there is no outside shadow. -->
    <radialGradient id="dlGlow" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#D9F99D" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#A7F3D0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip keeps the highlight from spilling past the rounded corners -->
    <clipPath id="dlClip">
      <rect x="1.5" y="1.5" width="337" height="55" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Body + 3px bright lime border -->
  <rect x="1.5" y="1.5" width="337" height="55" rx="12" ry="12"
        fill="url(#dlBg)" stroke="#BEF264" stroke-width="3"/>

  <g clip-path="url(#dlClip)">
    <rect x="1.5" y="1.5" width="337" height="55" fill="url(#dlGlow)"/>
    <!-- Slim top highlight for the lit look -->
    <rect x="1.5" y="1.5" width="337" height="16" fill="#ECFCCB" opacity="0.16"/>
  </g>

  <!-- Download glyph: arrow into a tray -->
  <g transform="translate(52 29)" fill="none" stroke="#FFFFFF" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -10 V 4"/>
    <path d="M-6 -1.5 L 0 4.5 L 6 -1.5"/>
    <path d="M-9 8.5 H 9"/>
  </g>

  <text x="196" y="29" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">DOWNLOAD RESUME</text>
</svg>
