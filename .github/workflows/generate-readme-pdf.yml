name: Generate README PDF

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/generate-readme-pdf.yml'
      - '.github/readme-pdf.config.cjs'
      - '.github/readme-pdf.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-readme-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish README PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the PDF from README.md
        run: |
          mkdir -p generated
          npx --yes md-to-pdf@5.2.5 \
            --config-file .github/readme-pdf.config.cjs \
            README.md
          test -s generated/README.pdf

      - name: Commit the refreshed PDF when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/README.pdf

          if git diff --cached --quiet; then
            echo "README PDF is already current."
            exit 0
          fi

          git commit -m "chore: regenerate README PDF [skip ci]"
          git push
